<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Physics Nexus">
<meta name="theme-color" content="#07090f" id="themeColorMeta">
<title>PHYSICS NEXUS</title>
<style>
/* ── THEME TOKENS ── */
:root,[data-theme="dark"]{
  --bg:#07090f;--bg2:#0d1120;
  --panel:rgba(13,18,38,0.92);--panel2:rgba(20,26,52,0.95);
  --glass:rgba(255,255,255,0.045);--rim:rgba(255,255,255,0.09);
  --t1:#e8eaf6;--t2:#7986cb;--t3:#4a5568;
  --shadow:0 8px 32px rgba(0,0,0,.55);
  --card-bg:rgba(13,18,38,0.92);
  --opt-hover:rgba(126,232,250,0.07);
  --explain-bg:rgba(126,232,250,0.05);
  --explain-border:rgba(126,232,250,0.18);
  --explain-text:#b0bec5;
  --theme-icon:☀️;
}
[data-theme="light"]{
  --bg:#f0f4ff;--bg2:#e8eef8;
  --panel:rgba(255,255,255,0.96);--panel2:rgba(248,250,255,0.98);
  --glass:rgba(0,0,0,0.03);--rim:rgba(0,0,0,0.10);
  --t1:#1a1f3c;--t2:#4a5568;--t3:#9aa5b4;
  --shadow:0 4px 20px rgba(0,0,0,.12);
  --card-bg:rgba(255,255,255,0.96);
  --opt-hover:rgba(99,102,241,0.07);
  --explain-bg:rgba(99,102,241,0.04);
  --explain-border:rgba(99,102,241,0.20);
  --explain-text:#374151;
  --theme-icon:🌙;
}

/* ── ACCENT (same both themes) ── */
:root{
  --accent:#7ee8fa;--mag:#e040fb;--heat:#ff6b35;--sound:#00e676;
  --elec:#ffe57f;--motion:#64ffda;--lens:#80deea;--meas:#b39ddb;
  --correct:#00c853;--wrong:#ff5252;
}

/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  min-height:100vh;min-height:-webkit-fill-available;
  overflow-x:hidden;
  /* Safe area for notch/home indicator */
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── PARTICLE CANVAS ── */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6}
[data-theme="light"] #bg{opacity:.18}

/* ── LAYOUT ── */
.shell{
  position:relative;z-index:2;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:max(16px, env(safe-area-inset-top)) 16px max(32px, calc(env(safe-area-inset-bottom) + 16px));
}
.screen{display:none;width:100%;max-width:680px;flex-direction:column;align-items:center;gap:14px;animation:fadeIn .22s ease}
.screen.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── GLASS CARD ── */
.card{
  background:var(--card-bg);
  border:1px solid var(--rim);
  border-radius:20px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  padding:20px;width:100%;
}
.card.slim{padding:14px 18px}
.card.xs{padding:10px 14px}
[data-theme="light"] .card{box-shadow:0 2px 12px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.06)}
[data-theme="light"] .stat{background:rgba(255,255,255,.9);border-color:rgba(0,0,0,.1)}
[data-theme="light"] .stat-l{color:#6b7280}
[data-theme="light"] .lbl{color:#6b7280}
[data-theme="light"] .q-cat-name{color:#6b7280}
[data-theme="light"] .q-diff{color:#374151;border-color:rgba(0,0,0,.15)}
[data-theme="light"] .sdot{background:#d1d5db}
[data-theme="light"] .opt-lbl{background:#e5e7eb;color:#374151}
[data-theme="light"] .t-bg{stroke:#e5e7eb}
[data-theme="light"] .t-fg{stroke:#4f46e5}
[data-theme="light"] .t-center{color:#1a1f3c}
[data-theme="light"] .explain-text{color:#374151}

/* ── LOGO ── */
.logo{
  font-family:'SF Mono','Courier New',monospace;
  font-size:clamp(1.6rem,7vw,2.8rem);
  font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  background:linear-gradient(135deg,#7ee8fa,#e040fb 55%,#ffe57f);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-align:center;
  filter:drop-shadow(0 0 20px rgba(126,232,250,.3));
  line-height:1.1;
}
.logo-sub{font-size:.62rem;letter-spacing:.35em;color:var(--t2);text-transform:uppercase;text-align:center;margin-top:4px}
[data-theme="light"] .logo{filter:drop-shadow(0 0 12px rgba(126,232,250,.2))}

/* ── TYPOGRAPHY ── */
h2{font-size:1rem;font-weight:700;margin-bottom:10px;color:var(--t1);letter-spacing:.01em}
.lbl{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--t2)}

/* ── TOP NAV BAR ── */
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  width:100%;max-width:680px;
  padding:6px 0 2px;
}
.theme-btn{
  width:40px;height:40px;border-radius:50%;
  background:var(--glass);border:1px solid var(--rim);
  font-size:1.1rem;display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;
}
.theme-btn:hover{background:var(--opt-hover);transform:scale(1.08)}
.theme-btn:active{transform:scale(.94)}

/* ── XP BAR ── */
.xp-strip{width:100%;height:3px;background:var(--glass);border-radius:2px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--mag),var(--accent));border-radius:2px;transition:width .6s cubic-bezier(.34,1.56,.64,1)}

/* ── STAT ROW ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.stat{background:var(--glass);border:1px solid var(--rim);border-radius:14px;padding:10px 6px;text-align:center}
.stat-v{font-size:1.2rem;font-weight:700;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;color:var(--accent)}
[data-theme="light"] .stat-v{color:#4f46e5}
[data-theme="light"] .hud-big{color:#1a1f3c !important}
[data-theme="light"] #qScore{color:#4f46e5 !important}
[data-theme="light"] #qXP{color:#7c3aed !important}
[data-theme="light"] .streak-badge{color:#059669}
[data-theme="light"] .level-badge{background:linear-gradient(135deg,#7c3aed,#4f46e5)}
[data-theme="light"] .xp-fill{background:linear-gradient(90deg,#7c3aed,#4f46e5)}
[data-theme="light"] .logo{filter:drop-shadow(0 0 8px rgba(79,70,229,.25))}
[data-theme="light"] .exp-lbl{color:#4f46e5}
[data-theme="light"] .btn-next{background:linear-gradient(135deg,rgba(79,70,229,.15),rgba(124,58,237,.15));border-color:rgba(79,70,229,.4);color:#4f46e5}
.stat-l{font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t2);margin-top:2px}

/* ── LEVEL STRIP ── */
.level-strip{display:flex;align-items:center;gap:14px;width:100%}
.level-badge{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--mag),var(--accent));
  display:flex;align-items:center;justify-content:center;
  font-family:'SF Mono','Courier New',monospace;font-size:1.3rem;font-weight:800;color:#fff;
  box-shadow:0 0 18px rgba(126,232,250,.28);
}
.level-info{flex:1;min-width:0}
.streak-badge{font-size:1rem;font-weight:700;font-family:'SF Mono','Courier New',monospace;color:var(--sound);flex-shrink:0}

/* ── DIFF BUTTONS ── */
.diff-row{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.diff-btn{
  padding:9px 22px;border-radius:50px;
  border:1.5px solid var(--rim);background:var(--glass);
  color:var(--t2);font-size:.8rem;letter-spacing:.05em;
  transition:all .18s;font-family:'SF Mono','Courier New',monospace;
  font-weight:600;
}
.diff-btn.on{background:rgba(126,232,250,.14);color:var(--accent);border-color:var(--accent);box-shadow:0 0 14px rgba(126,232,250,.18)}
.diff-btn:active{transform:scale(.95)}

/* ── CATEGORY GRID ── */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:500px){.cat-grid{grid-template-columns:repeat(4,1fr)}}
.cat-btn{
  background:var(--glass);border:1.5px solid var(--rim);border-radius:16px;
  padding:16px 10px;text-align:center;color:var(--t1);
  position:relative;overflow:hidden;transition:all .22s;
}
.cat-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--ca),var(--cb));opacity:0;transition:opacity .22s;border-radius:14px;pointer-events:none}
.cat-btn:hover::after,.cat-btn:active::after{opacity:.15}
.cat-btn:hover{border-color:var(--ca);box-shadow:0 4px 20px -4px var(--ca);transform:translateY(-2px)}
.cat-btn:active{transform:scale(.96)}
.cat-icon{font-size:1.7rem;display:block;margin-bottom:6px;position:relative;z-index:1}
.cat-name{font-size:.7rem;font-weight:700;letter-spacing:.02em;position:relative;z-index:1;line-height:1.2}
.cat-cnt{font-size:.58rem;color:var(--t2);margin-top:3px;position:relative;z-index:1}

/* ── BIG ACTION BTN ── */
.btn-primary{
  width:100%;padding:16px;border-radius:16px;
  background:linear-gradient(135deg,rgba(126,232,250,.18),rgba(224,64,251,.18));
  border:1.5px solid rgba(126,232,250,.4);
  color:var(--accent);font-size:1rem;font-weight:700;letter-spacing:.04em;
  transition:all .2s;font-family:'SF Mono','Courier New',monospace;
  box-shadow:0 4px 24px rgba(126,232,250,.12);
}
.btn-primary:hover{box-shadow:0 0 28px rgba(126,232,250,.28);transform:translateY(-1px)}
.btn-primary:active{transform:scale(.97)}
[data-theme="light"] .btn-primary{background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(168,85,247,.12));border-color:rgba(99,102,241,.4);color:#4f46e5;box-shadow:0 4px 16px rgba(99,102,241,.15)}

/* ── HUD ── */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hud-score{text-align:center;min-width:60px}
.hud-big{font-size:1.4rem;font-weight:800;font-family:'SF Mono','Courier New',monospace}
.hud-center{flex:1;min-width:0}
.prog-wrap{width:100%;height:5px;background:var(--glass);border-radius:3px;overflow:hidden;margin-top:5px}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--mag));transition:width .4s ease}
.sdots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:7px}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--rim);transition:all .25s;flex-shrink:0}
.sdot.hit{background:var(--correct);box-shadow:0 0 6px var(--correct)}
.sdot.miss{background:var(--wrong)}

/* ── TIMER ── */
.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.timer-ring{position:relative;width:52px;height:52px}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:4}
.t-bg{stroke:var(--rim)}
.t-fg{stroke:var(--accent);stroke-dasharray:138;stroke-linecap:round;transition:stroke-dashoffset .95s linear,stroke .3s}
.t-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'SF Mono','Courier New',monospace;font-size:.85rem;font-weight:800}

/* ── SOUND BTN ── */
.snd-btn{
  padding:6px 14px;border-radius:50px;
  background:var(--glass);border:1px solid var(--rim);
  color:var(--t2);font-size:.75rem;align-self:flex-end;
  transition:all .18s;
}
.snd-btn:active{transform:scale(.94)}

/* ── QUESTION CARD ── */
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.q-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.q-cat-name{font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--t2)}
.q-diff{font-size:.58rem;background:var(--glass);border:1px solid var(--rim);border-radius:50px;padding:2px 8px;color:var(--t2);font-family:'SF Mono','Courier New',monospace;font-weight:600}
.q-text{font-size:clamp(.95rem,2.6vw,1.05rem);line-height:1.65;font-weight:500;margin-bottom:14px;color:var(--t1)}

/* ── DIAGRAM ── */
.diagram-wrap{
  width:100%;border-radius:14px;overflow:hidden;
  border:1px solid var(--rim);
  background:rgba(0,0,0,.3);
  margin-bottom:14px;
  display:flex;align-items:center;justify-content:center;
  min-height:140px;max-height:240px;
}
[data-theme="light"] .diagram-wrap{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.1)}
.diagram-wrap svg{width:100%;height:auto;display:block;max-height:240px}

/* ── OPTIONS ── */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  background:var(--glass);border:1.5px solid var(--rim);border-radius:14px;
  padding:13px 14px;color:var(--t1);font-size:clamp(.84rem,2.4vw,.92rem);
  line-height:1.45;text-align:left;transition:all .18s;
  display:flex;align-items:flex-start;gap:10px;width:100%;
}
.opt:hover:not(:disabled){background:var(--opt-hover);border-color:rgba(126,232,250,.4);transform:translateX(2px)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt-lbl{
  font-family:'SF Mono','Courier New',monospace;font-size:.65rem;font-weight:700;
  background:var(--rim);border-radius:6px;padding:3px 8px;
  flex-shrink:0;margin-top:1px;color:var(--t2);min-width:26px;text-align:center;
}
.opt.correct{background:rgba(0,200,83,.12);border-color:var(--correct);box-shadow:0 0 16px rgba(0,200,83,.18)}
.opt.correct .opt-lbl{background:var(--correct);color:#fff}
.opt.wrong{background:rgba(255,82,82,.12);border-color:var(--wrong);box-shadow:0 0 14px rgba(255,82,82,.15)}
.opt.wrong .opt-lbl{background:var(--wrong);color:#fff}
.opt:disabled{cursor:default;opacity:.9}
[data-theme="light"] .opt:hover:not(:disabled){border-color:rgba(99,102,241,.4)}

/* ── EXPLANATION ── */
.explain{
  background:var(--explain-bg);border:1px solid var(--explain-border);
  border-radius:12px;padding:12px 16px;font-size:.82rem;line-height:1.7;
  color:var(--explain-text);display:none;margin-top:10px;
}
.explain.show{display:block;animation:fadeIn .2s ease}
.exp-lbl{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:5px;font-weight:700}

/* ── NEXT BTN ── */
.next-wrap{width:100%;display:flex;justify-content:flex-end;margin-top:4px}
.btn-next{
  padding:12px 28px;border-radius:50px;
  background:linear-gradient(135deg,rgba(126,232,250,.2),rgba(224,64,251,.2));
  border:1.5px solid rgba(126,232,250,.4);
  color:var(--accent);font-size:.9rem;font-weight:700;
  font-family:'SF Mono','Courier New',monospace;letter-spacing:.04em;
  transition:all .18s;
}
.btn-next:active{transform:scale(.95)}

/* ── GHOST BTN ── */
.btn-ghost{
  padding:10px 22px;border-radius:50px;
  background:var(--glass);border:1px solid var(--rim);
  color:var(--t2);font-size:.8rem;transition:all .18s;
}
.btn-ghost:active{transform:scale(.95)}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}

/* ── RESULTS ── */
.res-score{
  font-family:'SF Mono','Courier New',monospace;
  font-size:clamp(2.8rem,11vw,4.5rem);font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--mag));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-align:center;line-height:1;
}
.grade{
  font-family:'SF Mono','Courier New',monospace;font-size:1.1rem;font-weight:700;
  text-align:center;padding:12px;border-radius:14px;margin:12px auto;max-width:300px;width:100%;
}
.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:360px){.breakdown{grid-template-columns:repeat(2,1fr)}}
.bitem{background:var(--glass);border:1px solid var(--rim);border-radius:12px;padding:11px 8px;text-align:center}
.bval{font-size:1.1rem;font-weight:800;font-family:'SF Mono','Courier New',monospace}
.blbl{font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--t2);margin-top:3px}

/* ── ACHIEVEMENTS ── */
.ach-row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.ach{background:var(--glass);border:1px solid var(--rim);border-radius:50px;padding:6px 14px;font-size:.76rem;display:flex;align-items:center;gap:5px}
.ach.on{border-color:var(--elec);color:var(--elec);background:rgba(255,229,127,.06)}

/* ── LEADERBOARD ── */
.lb-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--rim)}
.lb-row:last-child{border-bottom:none}

/* ── XP FLASH ── */
.xp-flash{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);font-family:'SF Mono','Courier New',monospace;font-size:1.8rem;font-weight:800;pointer-events:none;z-index:999;opacity:0;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.xp-flash.pop{animation:xpPop .8s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes xpPop{0%{opacity:1;transform:translate(-50%,-60%)}80%{opacity:.8}100%{opacity:0;transform:translate(-50%,-130%)}}

/* ── KB HINTS ── */
.kb-hints{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;opacity:.4}
.kb{font-size:.64rem;color:var(--t2)}
.key{background:var(--glass);border:1px solid var(--rim);border-radius:4px;padding:1px 6px;font-family:'SF Mono','Courier New',monospace;font-size:.6rem}

/* ── HIDDEN ── */
.hidden{display:none!important}

/* ── ANIMATIONS ── */
.ray-anim{animation:rayFade 2s ease-in-out infinite alternate}
@keyframes rayFade{0%{opacity:.55}100%{opacity:1}}
.pulse-anim{animation:pulseGlow 1.8s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{opacity:.45}50%{opacity:1}}

/* ── MOBILE TOUCH SCROLL FIX ── */
.screen{-webkit-overflow-scrolling:touch}

/* ── LIGHT MODE SVG DIAGRAMS ── */
[data-theme="light"] .diagram-wrap svg rect[height="220"]{fill:#f8faff !important}
[data-theme="light"] .diagram-wrap svg text{fill:#1a1f3c}

/* ── SAFE AREA SPACING ── */
@supports(padding:env(safe-area-inset-bottom)){
  .shell{padding-bottom:max(32px,calc(env(safe-area-inset-bottom)+16px))}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="xp-flash" id="xpFlash"></div>
<div class="shell">

<!-- TOP BAR -->
<div class="topbar">
  <div style="font-family:'SF Mono','Courier New',monospace;font-size:.6rem;letter-spacing:.2em;color:var(--t2);text-transform:uppercase">Physics Nexus</div>
  <button class="theme-btn" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle theme">☀️</button>
</div>

<!-- ══ HOME ══ -->
<div class="screen active" id="sHome">

  <div style="text-align:center;padding:4px 0 2px">
    <div class="logo">PHYSICS<br>NEXUS</div>
    <div class="logo-sub">Visual Science Lab</div>
  </div>

  <!-- Level + XP -->
  <div class="card slim">
    <div class="level-strip">
      <div class="level-badge" id="hLevel">1</div>
      <div class="level-info">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <span class="lbl">Experience</span><span class="lbl" id="hXPLabel">0 / 300</span>
        </div>
        <div class="xp-strip"><div class="xp-fill" id="hXPBar" style="width:0%"></div></div>
      </div>
      <div class="streak-badge" id="hStreak">🔥0</div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat"><div class="stat-v" id="sGames">0</div><div class="stat-l">Games</div></div>
    <div class="stat"><div class="stat-v"><span id="sBest">0</span><span style="font-size:.72em;font-weight:600;opacity:.75">%</span></div><div class="stat-l">Best</div></div>
    <div class="stat"><div class="stat-v" id="sXP">0</div><div class="stat-l">XP</div></div>
    <div class="stat"><div class="stat-v" id="sAns">0</div><div class="stat-l">Answered</div></div>
  </div>

const QS=[
{c:'light',d:'easy',img:'periscope',
 q:"A periscope uses how many plane mirrors, and at what angle are they positioned?",
 o:["1 mirror at 90°","2 mirrors at 45°","3 mirrors at 60°","4 mirrors at 30°"],a:1,
 ex:"A periscope uses exactly 2 plane mirrors, each tilted at 45° to the normal. Light enters at the top, reflects off Mirror 1 horizontally, then reflects off Mirror 2 downward to the observer — rotating the light path by 180°."},
{c:'light',d:'easy',img:'reflection_law',
 q:"When light reflects off a mirror, the angle of incidence and angle of reflection are both measured from the:",
 o:["Mirror surface","Edge of the ray","Normal to the surface","Horizontal plane"],a:2,
 ex:"Both angles are always measured from the 'normal' — an imaginary perpendicular line to the mirror surface at the point of incidence. This ensures θᵢ = θᵣ regardless of the mirror's orientation."},
{c:'light',d:'medium',img:'reflection_law',
 q:"An object is placed 20 cm in front of a plane mirror. What is the total distance between the object and its image?",
 o:["20 cm","30 cm","40 cm","10 cm"],a:2,
 ex:"In a plane mirror the image forms as far behind the mirror as the object is in front. Object = 20 cm front; image = 20 cm behind mirror. Total distance = 20 + 20 = 40 cm."},
{c:'light',d:'medium',img:'color_spectrum',
 q:"The diagram shows white light dispersed by a prism. Which colour bends (refracts) the MOST?",
 o:["Red (~700 nm)","Green (~550 nm)","Violet (~400 nm)","Yellow (~580 nm)"],a:2,
 ex:"Violet has the shortest wavelength and highest frequency, so it slows more in glass and bends the most (highest refractive index). Red has the longest wavelength and bends least — that's why red appears at top of rainbow and violet at bottom."},
{c:'light',d:'easy',img:'color_spectrum',
 q:"From the spectrum diagram, who first proved white light contains all 7 colours?",
 o:["Einstein","Galileo","Isaac Newton","James Clerk Maxwell"],a:2,
 ex:"Isaac Newton (1672) used a glass prism to split white light into ROYGBIV. He then used a second prism to recombine the spectrum back into white light — proving the colours were IN the light, not added by the prism."},
{c:'light',d:'hard',img:'reflection_law',
 q:"A plane mirror is rotated through 15°. Through how many degrees does the reflected ray rotate?",
 o:["15°","30°","7.5°","45°"],a:1,
 ex:"When a mirror rotates by angle θ, the reflected ray rotates by 2θ. Both the angle of incidence AND the angle of reflection change simultaneously. So 15° mirror rotation → 30° rotation of reflected ray. Used in galvanometers and optical levers."},
{c:'light',d:'medium',img:'reflection_law',
 q:"In regular (specular) reflection from a smooth mirror surface, the reflected rays are:",
 o:["Scattered in all directions","Parallel to each other and follow θᵢ=θᵣ","Absorbed by the surface","Refracted through the mirror"],a:1,
 ex:"Specular (regular) reflection occurs on smooth surfaces: all parallel incoming rays reflect at equal angles and leave as parallel rays, forming a clear image. Rough surfaces cause diffuse reflection where rays scatter in all directions."},
{c:'light',d:'hard',img:'color_spectrum',
 q:"In additive colour mixing (mixing coloured light beams), Red + Green produces:",
 o:["White","Cyan","Yellow","Magenta"],a:2,
 ex:"Additive mixing with light: R+G=Yellow, R+B=Magenta, G+B=Cyan, R+G+B=White. This is how TV screens work using RGB pixels. Subtractive mixing (paints/dyes) is completely different: mixing all pigments gives black."},

{c:'magnet',d:'easy',img:'magnet_field',
 q:"From the diagram, magnetic field lines exit from the ___ pole outside the magnet.",
 o:["South","North","Both poles","The centre"],a:1,
 ex:"By convention, external magnetic field lines leave the North pole, curve through space, and re-enter at the South pole. Inside the magnet, field lines run from South to North. Compass needles align with these field lines."},
{c:'magnet',d:'medium',img:'right_hand_rule',
 q:"The Right-Hand Thumb Rule for a current-carrying wire: the thumb points in the direction of:",
 o:["The magnetic field B","Electric potential","Conventional current I","Force on the wire"],a:2,
 ex:"Right-Hand Thumb Rule: point the right thumb in the direction of conventional current (positive to negative). The curled fingers show the direction of circular magnetic field lines around the wire."},
{c:'magnet',d:'easy',img:'magnet_field',
 q:"Two bar magnets have their North poles facing each other. What force acts between them?",
 o:["Attractive — they pull together","Repulsive — they push apart","No force","They spin around each other"],a:1,
 ex:"Like poles repel, unlike poles attract. Two North poles produce repulsion. The field lines from both North poles point outward and push against each other. Two South poles would also repel; N facing S would attract."},
{c:'magnet',d:'medium',img:'right_hand_rule',
 q:"Fleming's Left-Hand Rule (FBI rule) is used specifically to find the force on:",
 o:["A permanent magnet in a field","A current-carrying conductor in a magnetic field","A stationary electric charge","A moving charge in vacuum"],a:1,
 ex:"Fleming's LH Rule: First finger = Field (B direction), seCond finger = Current (I direction), thuMb = Motion/force direction. Remember: FBI. It applies to electric motors where current-carrying conductors experience force in a magnetic field."},
{c:'magnet',d:'hard',img:'magnet_field',
 q:"An electromagnet differs from a permanent magnet because the electromagnet:",
 o:["Cannot attract iron filings","Has no magnetic poles","Loses its magnetism when current stops","Is always weaker"],a:2,
 ex:"An electromagnet requires electric current to maintain its magnetic field — it is a temporary magnet. Cut the current and the field collapses. This controllability makes it valuable: you can switch it on/off and vary strength by changing current (e.g. cranes, MRI)."},
{c:'magnet',d:'hard',img:'magnet_field',
 q:"Earth's geographic North Pole corresponds to a magnetic ___ pole.",
 o:["North magnetic pole","South magnetic pole","East magnetic pole","Neutral pole"],a:1,
 ex:"Earth's geographic North is actually near the magnetic South Pole. A compass needle's north-seeking end (magnetic north) is attracted to Earth's geographic north because opposite poles attract. Earth's magnetic poles slowly migrate over decades."},

{c:'sound',d:'easy',img:'sound_wave_diag',
 q:"The diagram shows compressions (C) and rarefactions (R). Sound waves are classified as:",
 o:["Transverse electromagnetic waves","Longitudinal mechanical waves","Transverse mechanical waves","Electromagnetic pressure waves"],a:1,
 ex:"Sound is a longitudinal wave: particles vibrate parallel (back-and-forth) to the direction of wave travel. Compressions are high-pressure regions; rarefactions are low-pressure. Sound needs a material medium — it cannot travel through vacuum."},
{c:'sound',d:'medium',img:'echo_diag',
 q:"From the echo diagram, for a distinct echo to be heard, the cliff must be at least:",
 o:["5 m away","10 m away","17 m away","50 m away"],a:2,
 ex:"The human ear cannot separate two sounds less than 0.1 s apart. d = ½ × v × t = ½ × 343 × 0.1 ≈ 17 m. The factor ½ accounts for the round trip. Closer than 17 m and the echo blends with the original — perceived as reverberation."},
{c:'sound',d:'easy',img:'sound_wave_diag',
 q:"Sound travels fastest through which medium?",
 o:["Air (gas)","Water (liquid)","Steel (solid)","Vacuum"],a:2,
 ex:"Sound speed depends on elasticity and density. Steel ≈ 5000 m/s; Water ≈ 1480 m/s; Air ≈ 343 m/s; Vacuum = 0 m/s. Solids transmit fastest because molecules are closest together — energy transfers more quickly between neighbours."},
{c:'sound',d:'hard',img:'echo_diag',
 q:"An echo returns in 0.4 s. How far is the reflecting wall? (v = 340 m/s)",
 o:["34 m","68 m","136 m","17 m"],a:1,
 ex:"d = (v × t) / 2 = (340 × 0.4) / 2 = 136 / 2 = 68 m. Divide by 2 because sound travels to the wall AND back — total path is twice the distance to the wall."},
{c:'sound',d:'medium',img:'sound_wave_diag',
 q:"The pitch (how high or low a sound seems) is determined by its:",
 o:["Amplitude","Frequency","Speed","Wavelength only"],a:1,
 ex:"Pitch corresponds to frequency. Higher frequency = higher pitch (soprano). Lower frequency = lower pitch (bass). Loudness is determined by amplitude. Speed depends on the medium, not the source."},

{c:'heat',d:'easy',img:'heat_transfer',
 q:"From the diagram, which heat transfer method works across a vacuum (no material needed)?",
 o:["Conduction","Convection","Radiation","Evaporation"],a:2,
 ex:"Radiation transfers heat via infrared electromagnetic waves that travel through vacuum. This is how the Sun heats Earth across ~150 million km of near-vacuum space. Conduction and convection both require matter to transmit heat."},
{c:'heat',d:'medium',img:'heat_transfer',
 q:"In the convection diagram, why does heated fluid rise upward?",
 o:["It becomes more dense","It becomes less dense","Its viscosity decreases","It radiates heat"],a:1,
 ex:"Heating a fluid causes molecules to move faster and spread apart — the fluid expands and becomes less dense. Less-dense fluid rises and denser cool fluid sinks to replace it, creating convection currents that distribute heat throughout."},
{c:'heat',d:'easy',img:'heat_transfer',
 q:"In conduction, heat energy is transferred through a solid by:",
 o:["Electrons moving backward","Vibrating molecules passing energy to neighbours","Bulk movement of fluid","Infrared radiation within the solid"],a:1,
 ex:"In solid conduction, thermal energy causes atoms at the hot end to vibrate more intensely. They collide with adjacent atoms, transferring kinetic energy progressively through the material — without any bulk movement of matter."},
{c:'heat',d:'hard',img:'heat_transfer',
 q:"A dark matt black surface compared to a shiny silver surface will:",
 o:["Absorb less and emit less radiation","Absorb more and emit more radiation","Reflect more radiation","Only absorb but never emit"],a:1,
 ex:"Dark matt (black) surfaces are the best absorbers AND emitters of thermal radiation. Shiny silvered surfaces are worst absorbers (best reflectors) AND worst emitters. This is why thermos flasks are silvered inside to minimize radiation heat loss."},

{c:'motion',d:'easy',img:'newtons_laws',
 q:"The 1st Law diagram shows inertia. Which correctly defines inertia?",
 o:["The force that causes acceleration","An object's resistance to changes in its state of motion","The rate of change of velocity","Momentum divided by time"],a:1,
 ex:"Inertia is the property of matter that resists changes in motion state. A stationary object resists being set in motion; a moving object resists being stopped or changing direction. Mass is the measure of inertia — heavier objects are harder to start/stop."},
{c:'motion',d:'medium',img:'free_fall',
 q:"The diagram shows free fall. After 3 seconds (g = 10 m/s², starting from rest), the ball's speed is:",
 o:["10 m/s","20 m/s","30 m/s","45 m/s"],a:2,
 ex:"v = u + gt = 0 + 10×3 = 30 m/s. In free fall, velocity increases by 10 m/s every second (g = 10 m/s²). The ball covers increasing distances each second — a hallmark of uniform acceleration."},
{c:'motion',d:'medium',img:'newtons_laws',
 q:"Newton's 2nd Law: if you double the force on an object while keeping mass constant:",
 o:["Acceleration halves","Acceleration stays the same","Acceleration doubles","Velocity doubles instantly"],a:2,
 ex:"a = F/m. Double F with same m → double acceleration. This is why a stronger push produces a faster acceleration. F = ma tells us force, mass, and acceleration are precisely proportional."},
{c:'motion',d:'hard',img:'free_fall',
 q:"A ball is thrown horizontally from a cliff at 20 m/s. How far has it fallen vertically after 2 s? (g = 10 m/s²)",
 o:["10 m","20 m","40 m","80 m"],a:1,
 ex:"Vertical and horizontal motions are independent (projectile motion). Vertical: s = ut + ½gt² = 0 + ½×10×4 = 20 m. The horizontal velocity (20 m/s) does not affect vertical free-fall."},
{c:'motion',d:'easy',img:'newtons_laws',
 q:"Newton's 3rd Law (diagram): when A pushes B with 50 N to the right, B pushes A with:",
 o:["25 N to the right","50 N to the left","50 N to the right","100 N to the left"],a:1,
 ex:"3rd Law: every action has an equal and opposite reaction. Forces always exist in pairs, act on different objects, have equal magnitudes and opposite directions. B pushes back on A with exactly 50 N but in the opposite direction."},
{c:'motion',d:'medium',img:'newtons_laws',
 q:"A 5 kg object accelerates at 6 m/s². The net force acting on it is:",
 o:["1.2 N","11 N","30 N","0.83 N"],a:2,
 ex:"F = ma = 5 × 6 = 30 N. This is the NET force — the vector sum of all forces. If friction of 5 N opposes motion, the applied force would need to be 35 N to achieve this net 30 N."},

{c:'elec',d:'easy',img:'series_parallel',
 q:"Comparing both circuit diagrams: in which circuit does the SAME current flow through all components?",
 o:["Parallel circuit","Series circuit","Both circuits","Neither — current always varies"],a:1,
 ex:"In a series circuit there is only one path for current — so the same current flows through every component. In parallel, current divides between branches. This is why a broken series bulb stops all others; parallel bulbs are independent."},
{c:'elec',d:'medium',img:'ohms_law',
 q:"Using the Ohm's Law triangle V=IR: if V=12V and R=4Ω, the current I equals:",
 o:["3 A","48 A","8 A","0.33 A"],a:0,
 ex:"I = V/R = 12/4 = 3 A. The triangle memory aid: cover I → see V/R. Cover V → see I×R. Cover R → see V/I. Always check units: Volts ÷ Ohms = Amperes."},
{c:'elec',d:'hard',img:'parallel_resistance',
 q:"The diagram shows two 6Ω resistors in parallel. Their combined resistance is:",
 o:["12 Ω","6 Ω","3 Ω","1 Ω"],a:2,
 ex:"1/R = 1/6 + 1/6 = 2/6 → R = 3 Ω. Parallel connection always reduces total resistance below the smallest individual resistor. Two equal resistors in parallel give exactly half the individual resistance."},
{c:'elec',d:'medium',img:'ohms_law',
 q:"The power dissipated by a 4Ω resistor connected to 12V is:",
 o:["3 W","36 W","48 W","12 W"],a:1,
 ex:"P = V²/R = 144/4 = 36 W. Alternatively: I = V/R = 3 A, then P = I²R = 9×4 = 36 W or P = IV = 3×12 = 36 W. All three power formulas give the same result."},
{c:'elec',d:'easy',img:'series_parallel',
 q:"Houses use parallel wiring. What advantage does this give for each appliance?",
 o:["All share a reduced voltage equally","Each gets the full mains voltage independently","All receive the same tiny current","All turn off if one fails"],a:1,
 ex:"In parallel house wiring, each appliance connects directly between live and neutral — receiving full mains voltage (~230V). Appliances operate independently: turning off one doesn't affect others, and a fault in one doesn't cut power to all."},

{c:'measure',d:'easy',img:'measurement_tools',
 q:"Which instrument in the diagram measures with the highest precision?",
 o:["Standard ruler","Vernier caliper","Micrometer screw gauge","Measuring tape"],a:2,
 ex:"Micrometer screw gauge: 0.01mm precision. Vernier caliper: 0.1mm. Standard ruler: 1mm. The micrometer uses a precisely machined screw where one complete turn moves the spindle exactly 0.5mm, with a 50-division thimble scale."},
{c:'measure',d:'medium',img:'measurement_tools',
 q:"How many significant figures are in the measurement 0.00450 m?",
 o:["6","5","3","2"],a:2,
 ex:"Leading zeros (before first non-zero digit) are NEVER significant — they only indicate magnitude. Trailing zeros after a decimal ARE significant. 0.00450 has 3 sig figs: 4, 5, and the final 0. Scientific notation: 4.50 × 10⁻³ m."},
{c:'measure',d:'easy',img:'measurement_tools',
 q:"Speed is a scalar quantity. How does a scalar differ from a vector?",
 o:["Direction but no magnitude","Magnitude and direction both","Magnitude only, no direction","Neither magnitude nor direction"],a:2,
 ex:"Scalars: magnitude only (speed=50 km/h, temperature=25°C, mass=70 kg). Vectors: magnitude AND direction (velocity=50 km/h north, force=10 N downward, displacement=5 m east). The difference matters when adding quantities — vectors add geometrically."},
{c:'measure',d:'hard',img:'measurement_tools',
 q:"Which of these is NOT a base SI unit?",
 o:["Kilogram (kg)","Kelvin (K)","Newton (N)","Second (s)"],a:2,
 ex:"The 7 SI base units: metre, kilogram, second, ampere, kelvin, mole, candela. The Newton (N = kg·m·s⁻²) is a derived unit — defined from base units. Similarly: Joule = kg·m²·s⁻², Watt = kg·m²·s⁻³."},

{c:'lens',d:'easy',img:'concave_lens',
 q:"The concave lens diagram shows that a diverging lens ALWAYS produces an image that is:",
 o:["Real, inverted, and magnified","Virtual, upright, and diminished","Real, upright, and same size","Virtual, inverted, and magnified"],a:1,
 ex:"A concave (diverging) lens always produces a virtual, upright, diminished image regardless of object position. Diverged rays appear to come from a closer virtual point — the image cannot be projected on a screen."},
{c:'lens',d:'medium',img:'convex_lens',
 q:"The convex lens diagram shows an object beyond F. The image formed is:",
 o:["Virtual and upright","Real and inverted","Always the same size as object","Behind the lens always"],a:1,
 ex:"When an object is beyond the focal point of a convex lens, refracted rays converge on the other side — forming a real, inverted image (can be projected on screen). The image size depends on exact object distance relative to F and 2F."},
{c:'lens',d:'medium',img:'refractive_index',
 q:"From the refractive index table, diamond (n=2.42) vs water (n=1.33) — light travels ___ in diamond.",
 o:["Faster","The same speed","Slower","Backwards"],a:2,
 ex:"n = c/v → v = c/n. Diamond: v = 3×10⁸/2.42 ≈ 1.24×10⁸ m/s. Water: v = 3×10⁸/1.33 ≈ 2.26×10⁸ m/s. Diamond's dense carbon lattice slows light dramatically, causing higher bending — hence the brilliant sparkle from total internal reflection."},
{c:'lens',d:'hard',img:'refraction_diag',
 q:"Using Snell's Law (n₁sinθ₁=n₂sinθ₂): ray from air (n=1.0) into glass (n=1.5) at θ₁=30°. Find θ₂.",
 o:["19.5°","30°","45°","60°"],a:0,
 ex:"1.0 × sin30° = 1.5 × sinθ₂ → 0.5 = 1.5 × sinθ₂ → sinθ₂ = 0.333 → θ₂ = 19.5°. Light bends toward the normal when entering a denser medium (n₂>n₁), so θ₂ < θ₁ — the ray is closer to the normal."},
{c:'lens',d:'easy',img:'refraction_diag',
 q:"A swimming pool looks shallower than it really is because of:",
 o:["Reflection at the surface","Diffraction at the water surface","Refraction — light bends as it exits water","Absorption of light by water"],a:2,
 ex:"Light from underwater objects bends away from the normal as it exits into air (less dense medium). Our brain assumes straight-line travel, so the object appears closer to the surface. This apparent depth effect also explains why a stick appears bent at water's surface."},
{c:'lens',d:'medium',img:'convex_lens',
 q:"A magnifying glass uses a convex lens. The object must be placed:",
 o:["Beyond 2F","At exactly 2F","Between F and the lens","At the focal point F"],a:2,
 ex:"When the object is between F and the convex lens, refracted rays diverge and appear to come from a larger virtual image on the same side as the object. This virtual, upright, magnified image is the magnifying glass effect."},
{c:'sound',d:'hard',img:'sound_wave_diag',
 q:"Medical ultrasound imaging works because high-frequency sound (>20,000 Hz) can:",
 o:["Be seen visually","Reflect off tissue boundaries and return as detectable echoes","Travel faster than regular sound","Penetrate without any reflection"],a:1,
 ex:"Medical ultrasound (1–20 MHz) pulses reflect off tissue boundaries with different acoustic impedance (skin, organs, bone). Return times and intensities are processed to build real-time images. Safe: non-ionising unlike X-rays. Used for pregnancy scans, organ imaging."},
{c:'heat',d:'medium',img:'heat_transfer',
 q:"Why does a metal spoon feel colder than a wooden spoon at room temperature?",
 o:["Metal is actually colder than wood","Metal conducts heat from your hand faster","Wood stores more heat","Metal reflects infrared from your hand"],a:1,
 ex:"Both spoons are at room temperature (~20°C), cooler than your hand (~37°C). Metal conducts heat away from your skin rapidly — your hand loses heat quickly and feels cold. Wood is a poor conductor; heat transfer is slow, so wood feels less cold despite being the same temperature."},
